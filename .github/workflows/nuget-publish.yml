name: Build and Publish to NuGet (Auto-Version)

on:
  push:
    branches: [ publish ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for version calculation
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Calculate Version
      id: version
      run: |
        # Use run number for patch version
        PATCH_VERSION=${{ github.run_number }}
        VERSION="1.0.$PATCH_VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
    
    - name: Pack with Version
      run: dotnet pack --configuration Release --no-build --output ./artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Check if version exists
      id: version_check
      run: |
        if dotnet nuget search YourPackage.Name --exact-match | grep -q "${{ steps.version.outputs.version }}"; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Create Git Tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag "v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"
